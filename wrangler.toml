name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 开启 workers.dev 子域名
workers_dev = true
preview_urls = true

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# KV 命名空间配置（默认模板不预设固定 ID，运行 npm run setup 自动生成）

# 定时任务配置 - 每小时检查一次（UTC）


# KV 命名空间配置（自动生成）
[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "66fca1d16e9d4bbf975ec6d9d7c06453"
preview_id = "f6bc00caec6e4d118cafe761a8c9ca9f"

[triggers]
crons = ["0 * * * *"]

# 环境变量（可选，也可以在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"

[[routes]]
pattern = "sub.rel.qzz.io"
custom_domain = true
